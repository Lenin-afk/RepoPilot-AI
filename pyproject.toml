[project]
name = "repopilot-ai"
version = "0.1.0"
description = "Local, grounded answers about Python repositories using retrieval-augmented generation"
readme = "README.md"
authors = [
    { name = "Lenin", email = "leninrithick@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
repopilot-ai = "repopilot_ai:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
